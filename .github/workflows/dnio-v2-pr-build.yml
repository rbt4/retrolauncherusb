name: Temporary DNIO V2 PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "dnio-offline-shell/**"
      - ".github/workflows/dnio-v2-pr-build.yml"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dnio-offline-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release and debug APKs
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name dnioTest --package "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd dnioTest \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data \
            > /tmp/dnio-emulator.log 2>&1 &
          adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true

      - name: Install and launch DNIO v2
        shell: bash
        run: |
          set -euxo pipefail
          adb logcat -c
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.dnio.gujarati.offline
          adb shell am start -W -n com.dnio.gujarati.offline/.MainActivity | tee /tmp/dnio-start.txt
          sleep 8
          adb exec-out screencap -p > /tmp/dnio-v2-launch.png
          adb logcat -d -t 1200 > /tmp/dnio-logcat.txt
          grep -q "Status: ok" /tmp/dnio-start.txt
          if grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com\.dnio\.gujarati\.offline" /tmp/dnio-logcat.txt; then
            echo "DNIO crashed during emulator smoke test"
            exit 1
          fi
          adb shell pidof com.dnio.gujarati.offline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dnio-v2-smoke-test
          path: |
            /tmp/dnio-v2-launch.png
            /tmp/dnio-start.txt
            /tmp/dnio-logcat.txt
            /tmp/dnio-emulator.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: dnio-gujarati-offline-v2-unsigned
          path: dnio-offline-shell/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
