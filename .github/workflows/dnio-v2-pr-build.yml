name: Temporary DNIO V2 PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "dnio-offline-shell/**"
      - ".github/workflows/dnio-v2-pr-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnio-offline-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build DNIO Gujarati Offline v2
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dnio-gujarati-offline-v2-unsigned
          path: dnio-offline-shell/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
