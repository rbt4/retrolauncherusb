name: Temporary DNIO Shell PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "dnio-offline-shell/**"
      - ".github/workflows/dnio-shell-pr-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnio-offline-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release shell
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dnio-shell-apk
          path: dnio-offline-shell/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Collect official Android signing tool
        run: |
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p signing-tools
          cp "$TOOLS/lib/apksigner.jar" signing-tools/apksigner.jar
          printf '%s\n' "$TOOLS" > signing-tools/build-tools-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner
          path: dnio-offline-shell/signing-tools/
          if-no-files-found: error
