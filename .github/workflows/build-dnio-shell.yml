name: Build DNIO Offline Shell

on:
  push:
    branches:
      - dnio-offline-player-build-20260803
    paths:
      - "dnio-offline-shell/**"
      - ".github/workflows/build-dnio-shell.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnio-offline-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release shell
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dnio-shell-apk
          path: dnio-offline-shell/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
