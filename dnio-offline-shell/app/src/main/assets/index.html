<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DNIO Gujarati Offline</title><style>
:root{color-scheme:dark;--b:#091018;--p:#111c28;--p2:#172534;--l:#26394b;--t:#f5f8fc;--m:#9fb0c1;--a:#75b5ff;--g:#45ce8b;--e:#f3bd55;--r:#ef7180}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#091018f2;border-bottom:1px solid var(--l);padding:14px}.wrap,main{max-width:1100px;margin:auto}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#6aaeff,#8d78ff);display:grid;place-items:center;color:#07101b;font-weight:900;font-size:19px}.title{font-size:20px;font-weight:850}.sub,.detail,.summary,.meta,.missing{color:var(--m);font-size:12px}.setup{margin-top:13px;padding:13px;border:1px solid var(--l);border-radius:15px;background:linear-gradient(135deg,#111d2a,#15283a)}.setup.ok{border-color:#45ce8b88}.setup.warn{border-color:#f3bd5588}.setup b{display:block}.buttons,.controls,.chips{display:flex;gap:8px;margin-top:10px}.buttons{flex-wrap:wrap}button,input{font:inherit;border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:10px;padding:9px 11px}.primary,.chip.active{background:var(--a);color:#07101b;border-color:transparent;font-weight:800}.missing{white-space:pre-wrap;max-height:75px;overflow:auto;margin-top:8px}.controls input{flex:1;min-width:0;background:#0b151f}.chips{overflow:auto}.chip{white-space:nowrap;color:var(--m);border-radius:999px;padding:7px 10px}main{padding:16px 14px 90px}.summary{margin-bottom:16px}.topic{margin-bottom:23px}.topic h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between}.topic h2 small{font-size:12px;color:var(--m);font-weight:500}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}.card{border:1px solid var(--l);background:var(--p);border-radius:15px;overflow:hidden;box-shadow:0 7px 24px #0003}.card.miss{opacity:.5}.poster{height:104px;display:grid;place-items:center;background:linear-gradient(145deg,#12263a,#243550);font-size:34px;font-weight:900;color:#91c3ff}.song .poster{background:linear-gradient(145deg,#2d1c48,#203551)}.body{padding:10px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;margin-top:3px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#526273;margin-right:5px}.Good{background:var(--g)}.Needs-Edit{background:var(--e)}.Bad{background:var(--r)}.empty{text-align:center;color:var(--m);padding:60px 10px}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{flex-wrap:wrap}.controls input{flex-basis:100%}.buttons button{flex:1}}
</style></head><body><header><div class="wrap"><div class="brand"><div class="logo">ગુ</div><div><div class="title">DNIO Gujarati Offline</div><div class="sub">Original MP4s • no login • no Internet</div></div></div><section id="setup" class="setup"><b id="st">Choose your Gujarati video folder</b><div id="sd" class="detail">Copy the 37 original MP4 files into one folder, then select it once.</div><div class="buttons"><button class="primary" id="choose">Choose video folder</button><button id="rescan">Rescan</button></div><div id="missing" class="missing"></div></section><div class="controls"><input id="q" placeholder="Search topics or filenames…"><button id="reset">Clear filters</button></div><div id="chips" class="chips"></div></div></header><main><div id="summary" class="summary"></div><div id="library"></div></main><script src="catalog.js"></script><script>
'use strict';const C=window.DNIO_CATALOG||[],$=s=>document.querySelector(s),F=['All','Lessons','Songs','Good','Needs Edit','Bad','Unreviewed','Missing'];let kind='All',review='All',S={scanning:false,folderSelected:false,folderLabel:'',availableCount:0,totalCount:C.length,availableIds:[],missingIds:C.map(x=>x.id),missingNames:[],reviews:{},error:''};const found=()=>new Set(S.availableIds||[]),rev=x=>(S.reviews&&S.reviews[x.id])||'Unreviewed';
window.DNIO_applyStatus=n=>{if(typeof n==='string')try{n=JSON.parse(n)}catch(e){return}S=Object.assign(S,n||{});setup();chips();render()};function call(n,a){try{if(!window.DNIO||typeof DNIO[n]!=='function')throw 0;return a===undefined?DNIO[n]():DNIO[n](a)}catch(e){alert('Close and reopen the app, then try again.')}}function setup(){let b=$('#setup'),t=$('#st'),d=$('#sd'),m=$('#missing');b.className='setup';m.textContent='';if(S.scanning){b.classList.add('warn');t.textContent='Scanning the selected folder…';d.textContent='Checking original filenames.'}else if(S.error){b.classList.add('warn');t.textContent='Folder access needs attention';d.textContent=S.error;m.textContent='Choose the folder again.'}else if(S.availableCount===S.totalCount&&S.totalCount){b.classList.add('ok');t.textContent=`Ready — all ${S.totalCount} videos found`;d.textContent=`Using “${S.folderLabel||'selected folder'}”. Files play directly without copying.`}else if(S.folderSelected){b.classList.add('warn');t.textContent=`${S.availableCount} of ${S.totalCount} videos found`;d.textContent=`Using “${S.folderLabel||'selected folder'}”. Add missing files and tap Rescan.`;m.textContent=(S.missingNames||[]).slice(0,12).join('\n')+((S.missingNames||[]).length>12?`\n…and ${S.missingNames.length-12} more`:'')}else{t.textContent='Choose your Gujarati video folder';d.textContent='Copy the 37 original MP4 files into one folder, then select it once.';m.textContent='Internal storage or SD card both work.'}}
function chips(){let b=$('#chips');b.innerHTML='';F.forEach(f=>{let x=document.createElement('button'),active=(['All','Lessons','Songs'].includes(f)?kind:review)===f;x.className='chip '+(active?'active':'');x.textContent=f;x.onclick=()=>{if(['All','Lessons','Songs'].includes(f)){kind=f;review='All'}else{review=f;kind='All'}chips();render()};b.appendChild(x)})}function match(x){let q=$('#q').value.trim().toLowerCase();if(q&&!`${x.title} ${x.topic} ${x.filename}`.toLowerCase().includes(q))return false;if(kind==='Lessons'&&x.kind!=='Lesson'||kind==='Songs'&&x.kind!=='Song')return false;let r=rev(x);if(review==='Missing'&&!(S.missingIds||[]).includes(x.id))return false;return ['All','Missing'].includes(review)||r===review}
function render(){let a=found(),V=C.filter(match),G={};V.forEach(x=>(G[x.topic]??=[]).push(x));$('#summary').textContent=`Showing ${V.length} of ${C.length} videos • ${S.availableCount||0} available`;let root=$('#library');root.innerHTML='';Object.entries(G).forEach(([topic,items])=>{let sec=document.createElement('section');sec.className='topic';sec.innerHTML=`<h2>${topic}<small>${items.length} video${items.length===1?'':'s'}</small></h2><div class="grid"></div>`;let grid=sec.querySelector('.grid');items.forEach(x=>{let ok=a.has(x.id),r=rev(x),card=document.createElement('article');card.className=`card ${x.kind==='Song'?'song':''} ${ok?'':'miss'}`;card.innerHTML=`<div class="poster">${ok?(x.kind==='Song'?'♫':'ગુ'):'!'}</div><div class="body"><div class="name">${x.title}</div><div class="meta"><span><i class="dot ${r.replace(/ /g,'-')}"></i>${ok?r:'Missing file'}</span><span>${x.duration_label}</span></div></div>`;card.onclick=()=>ok?call('play',x.id):alert(`Missing file:\n${x.filename}\n\nAdd it to the selected folder and tap Rescan.`);grid.appendChild(card)});root.appendChild(sec)});if(!V.length)root.innerHTML='<div class="empty">No videos match this filter.</div>'}
$('#choose').onclick=()=>call('chooseFolder');$('#rescan').onclick=()=>call('rescan');$('#q').oninput=render;$('#reset').onclick=()=>{kind='All';review='All';$('#q').value='';chips();render()};setup();chips();render();setTimeout(()=>{let x=call('getStatus');if(x)DNIO_applyStatus(x)},250);
</script></body></html>
