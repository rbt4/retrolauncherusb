<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DNIO Gujarati Offline</title><style>
:root{color-scheme:dark;--bg:#081019;--panel:#101c28;--panel2:#172737;--line:#263a4d;--text:#f4f8fc;--muted:#9fb0c1;--blue:#78b8ff;--green:#4bd493;--amber:#f4be5c;--red:#ef7482}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#081019f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.wrap,main{max-width:1120px;margin:auto}.top{padding:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#65aaff,#a17cff);display:grid;place-items:center;color:#06101a;font-size:20px;font-weight:950}.title{font-size:21px;font-weight:900}.sub,.meta,.summary{color:var(--muted);font-size:12px}.ready{margin-top:12px;border:1px solid #4bd49366;background:linear-gradient(135deg,#10291f,#14283a);border-radius:15px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.ready b{font-size:14px}.pill{white-space:nowrap;background:#4bd493;color:#06140d;font-weight:900;border-radius:999px;padding:7px 10px;font-size:12px}.controls{display:flex;gap:8px;margin-top:11px}.controls input,.chip{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px}.controls input{flex:1;min-width:0}.chips{display:flex;gap:7px;overflow:auto;padding-top:9px}.chip{white-space:nowrap;color:var(--muted);padding:7px 10px;border-radius:999px}.chip.active{background:var(--blue);border-color:transparent;color:#07111b;font-weight:850}main{padding:16px 14px 90px}.summary{margin-bottom:16px}.topic{margin:0 0 24px}.topic h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between}.topic h2 small{font-size:12px;color:var(--muted);font-weight:500}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:11px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 8px 26px #0004;cursor:pointer;transition:.15s transform,.15s border-color}.card:active{transform:scale(.985);border-color:var(--blue)}.poster{height:108px;display:grid;place-items:center;background:linear-gradient(145deg,#10283d,#29405a);font-size:35px;font-weight:950;color:#9acbff}.song .poster{background:linear-gradient(145deg,#301d4b,#233653)}.body{padding:10px}.name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;margin-top:4px;gap:6px}.state{display:flex;align-items:center;min-width:0}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#536476;margin-right:6px;flex:none}.Good{background:var(--green)}.Needs-Edit{background:var(--amber)}.Bad{background:var(--red)}.empty{text-align:center;color:var(--muted);padding:60px 10px}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{flex-wrap:wrap}.controls input{flex-basis:100%}}
</style></head><body><header><div class="wrap top"><div class="brand"><div class="logo">ગુ</div><div><div class="title">DNIO Gujarati Offline</div><div class="sub">All originals embedded • no login • no Internet</div></div></div><div class="ready"><div><b>Complete Gujarati video library</b><div class="sub">A selected video is prepared locally, then opened with Android’s native player.</div></div><span id="readyCount" class="pill">37 ready</span></div><div class="controls"><input id="q" placeholder="Search topics, titles or filenames…"><button class="chip" id="clear">Clear</button></div><div id="chips" class="chips"></div></div></header><main><div id="summary" class="summary"></div><div id="library"></div></main><script src="catalog.js"></script><script>
'use strict';const C=window.DNIO_CATALOG||[],$=s=>document.querySelector(s),FILTERS=['All','Lessons','Songs','Good','Needs Edit','Bad','Unreviewed'];let filter='All',S={availableCount:C.length,totalCount:C.length,reviews:{}};const topicIcon=t=>({Actions:'⚡',Animals:'🦁','Body Parts':'👋',Clothes:'👕',Colors:'🎨',Family:'🏠',Food:'🍽️','Fruit & Vegetables':'🍎','In the House':'🛋️',Nature:'🌿',Numbers:'123',Vehicles:'🚗'}[t]||'ગુ');const review=x=>(S.reviews&&S.reviews[x.id])||'Unreviewed';
function nativeCall(name,arg){try{if(!window.DNIO||typeof DNIO[name]!=='function')throw new Error();return arg===undefined?DNIO[name]():DNIO[name](arg)}catch(e){alert('The native player is not ready. Close and reopen the app.')}}window.DNIO_applyStatus=value=>{if(typeof value==='string')try{value=JSON.parse(value)}catch(e){return}S=Object.assign(S,value||{});$('#readyCount').textContent=`${S.availableCount||C.length} ready`;render()};
function chips(){let root=$('#chips');root.innerHTML='';FILTERS.forEach(name=>{let b=document.createElement('button');b.className='chip'+(filter===name?' active':'');b.textContent=name;b.onclick=()=>{filter=name;chips();render()};root.appendChild(b)})}
function matches(x){let q=$('#q').value.trim().toLowerCase();if(q&&!`${x.title} ${x.topic} ${x.filename}`.toLowerCase().includes(q))return false;if(filter==='Lessons')return x.kind==='Lesson';if(filter==='Songs')return x.kind==='Song';if(['Good','Needs Edit','Bad','Unreviewed'].includes(filter))return review(x)===filter;return true}
function render(){let visible=C.filter(matches),groups={};visible.forEach(x=>(groups[x.topic]??=[]).push(x));$('#summary').textContent=`Showing ${visible.length} of ${C.length} original videos • 3 hours 19 minutes`;let root=$('#library');root.innerHTML='';Object.entries(groups).forEach(([topic,items])=>{let sec=document.createElement('section');sec.className='topic';sec.innerHTML=`<h2>${topic}<small>${items.length} video${items.length===1?'':'s'}</small></h2><div class="grid"></div>`;let grid=sec.querySelector('.grid');items.forEach(x=>{let r=review(x),card=document.createElement('article');card.className=`card ${x.kind==='Song'?'song':''}`;card.innerHTML=`<div class="poster">${x.kind==='Song'?'♫':topicIcon(x.topic)}</div><div class="body"><div class="name">${x.title}</div><div class="meta"><span class="state"><i class="dot ${r.replace(/ /g,'-')}"></i>${r}</span><span>${x.duration_label}</span></div></div>`;card.onclick=()=>nativeCall('play',x.id);grid.appendChild(card)});root.appendChild(sec)});if(!visible.length)root.innerHTML='<div class="empty">No videos match this filter.</div>'}
$('#q').oninput=render;$('#clear').onclick=()=>{$('#q').value='';filter='All';chips();render()};chips();render();setTimeout(()=>{let status=nativeCall('getStatus');if(status)DNIO_applyStatus(status)},250);
</script></body></html>
